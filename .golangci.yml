version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - misspell
    - unconvert
    - copyloopvar

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
