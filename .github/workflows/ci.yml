name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# go-finding v1.9.2 imports encoding/json/v2; without this experiment the
# toolchain excludes those files and every build fails (all CI runs of
# 2026-09-10 were red for exactly this reason).
env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1

  drift-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Mechanism assertions against pinned samber/do versions
        run: go test ./pkg/healthwash/ -run TestDrift -v -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: golangci-lint
        # v7 is required for golangci-lint v2 version pins: action v6 rejects
        # `version: v2.13.2` outright ("golangci-lint v2 is not supported by
        # golangci-lint-action v6", run 35125328857).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v7.0.0
        with:
          # v2.13.2 is built with go1.27 >= go.mod's 1.27.1 floor and reads the
          # v2 config schema. `latest` resolves to a v1 binary that cannot load
          # the config at all (run 35089293309); never loosen this pin without
          # re-verifying `.custom-gcl.yml` and nixpkgs match it.
          version: v2.13.2

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: samber-linter checks itself (fixture module)
        run: |
          go run ./cmd/samber-linter --coverage-min 0.0 ./... >/dev/null
          go run ./cmd/samber-linter --output markdown --coverage-min 0.0 ./... >/dev/null
          go run ./cmd/samber-linter ./...
          echo "dogfood ok"

  upstream-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Compile and run docs/upstream Go snippets
        run: ./scripts/check-upstream-snippets.sh
